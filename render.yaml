# Deploy API to Render (free tier) — Cloudflare Containers requires Workers Paid plan.
# Connect repo at https://dashboard.render.com/blueprints → New Blueprint Instance
services:
  - type: web
    name: twoside-store-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://twoside-store.pages.dev
      - key: CLIENT_URL
        value: https://twoside-store.pages.dev
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
