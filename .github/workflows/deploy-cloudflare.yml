name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

env:
  PAGES_PROJECT: twoside-store
  NODE_VERSION: '22'
  CLOUDFLARE_ACCOUNT_ID: fc8761363df4a7a310cc35ed41d1c809
  WRANGLER_VERSION: '4.98.0'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm install @rolldown/binding-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --workspace=client --no-save

      - name: Build server
        run: npm run build:server

      - name: Run security tests
        run: npm run test -w server

      - name: Sync catalog images
        run: node scripts/sync-catalog-images.mjs
        env:
          CATALOG_CDN_SOURCE: https://03fee126.twoside-store.pages.dev

      - name: Build client
        run: npm run build:client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL || 'https://pub-9e3df3cf3913429bbaba57ed2d8f6e9b.r2.dev' }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER || '' }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '' }}

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: client/dist
          retention-days: 1

  deploy-pages:
    name: Deploy frontend (Pages CDN)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Require Cloudflare token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: client/dist

      - name: Verify artifact
        run: |
          test -f client/dist/index.html
          test -f client/dist/images/hero.webp
          ls -lh client/dist/images/hero.webp

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: client
        run: npx wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true

  deploy-api:
    name: Deploy API (Workers Container)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Require Cloudflare token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies (wrangler schema + monorepo)
        run: npm ci --include=optional

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker daemon
        run: docker info

      - name: Install API worker dependencies
        working-directory: cloudflare/api
        run: npm install

      - name: Deploy API container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare/api
        run: npx wrangler@${{ env.WRANGLER_VERSION }} deploy
